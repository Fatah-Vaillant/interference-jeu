<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title></title>
<link rel="preload" href="fonts/ChakraPetch-Bold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/ChakraPetch-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<div id="app">

  <!-- ===================== MISSIONS (accueil) ===================== -->
  <section class="screen on" id="s-home" data-i18n-aria="aria.missions">
    <header class="bar">
      <span class="credits stc" id="homeSt"></span>
      <span class="credits" id="homeCr"></span>
    </header>
    <div class="home">
      <div class="hero-wrap"><canvas class="hero" id="heroHome" aria-hidden="true"></canvas>
        <div class="world-info">
          <span class="over" id="wOver"></span>
          <h1 id="wName" class="rib"></h1>
          <span class="meta" id="wMeta"></span>
          <button class="craft" id="craftBtn"></button>
        </div>
      </div>
      <div class="home-panel">
        <canvas class="dial" id="homeDial" aria-hidden="true"></canvas>
        <div class="chips" id="chips" role="tablist" data-i18n-aria="aria.freqs"></div>
        <div class="missions" id="missions"></div>
        <button class="pill primary" id="launch"></button>
        <p class="goal" id="homeGoal"></p>
      </div>
    </div>
  </section>

  <!-- ===================== HANGAR ===================== -->
  <section class="screen" id="s-hangar" data-i18n-aria="aria.hangar">
    <header class="bar">
      <span class="credits stc" id="hangSt"></span>
      <h2 class="title rib" data-i18n="hangar.title"></h2>
      <span class="credits" id="hangCr"></span>
    </header>
    <div class="hangar" id="hangShips">
      <div class="hero-wrap small"><canvas class="hero" id="heroHangar" aria-hidden="true"></canvas>
        <div class="ship-head"><h1 id="shipName" class="rib"></h1><span class="meta" id="shipOrigin"></span></div>
        <button class="arr l" id="shipPrev" data-i18n-aria="hangar.prev"><svg viewBox="0 0 24 24"><path d="M15 5L8 12L15 19"/></svg></button>
        <button class="arr r" id="shipNext" data-i18n-aria="hangar.next"><svg viewBox="0 0 24 24"><path d="M9 5L16 12L9 19"/></svg></button>
      </div>
      <div class="ship-panel">
        <div class="stats" id="shipStats"></div>
        <p class="passive" id="shipPassive"></p>
        <p class="ultline" id="shipUlt"></p>
        <button class="pill primary" id="shipAct"></button>
      </div>
      <div class="carousel" id="shipList"></div>
    </div>
    <p class="upg-tip hidden" id="upgTip"></p><h3 class="section" id="hangUpgH"></h3>
    <div class="upg-grid" id="hangUpg"></div>
    <h3 class="section" data-i18n="hangar.acc"></h3>
    <div class="upg-grid acc" id="hangAcc"></div>
  </section>

  <!-- ===================== INFINI ===================== -->
  <section class="screen" id="s-inf" data-i18n-aria="aria.inf">
    <header class="bar"><span class="credits stc" id="infSt"></span><h2 class="title rib" data-i18n="inf.title"></h2><span class="credits" id="infCr"></span></header>
    <div class="inf">
      <p class="lede" data-i18n="inf.lede"></p>
      <div class="tiers" id="tierList" role="radiogroup" data-i18n-aria="inf.title"></div>
      <p class="inf-pal" id="infPal"></p>
      <button class="pill primary" id="infGo"></button>
    </div>
  </section>

  <!-- ===================== PROFIL ===================== -->
  <section class="screen" id="s-profile" data-i18n-aria="aria.profile">
    <header class="bar"><span class="credits stc" id="profSt"></span><h2 class="title rib" data-i18n="profile.title"></h2><span class="credits" id="profCr"></span></header>
    <div class="profile">
      <div class="rank-card" id="rankCard"></div>
      <div class="grid-stats" id="statGrid"></div>
      <h3 class="section" data-i18n="profile.trophies"></h3>
      <div class="trophies" id="trophies"></div>
      <h3 class="section" data-i18n="profile.archives"></h3>
      <div class="list" id="archives"></div>
      <h3 class="section" data-i18n="profile.settings"></h3>
      <!-- réglages de jeu : ce bloc est déplacé tel quel dans la feuille de pause (UI.pauseSettings), puis remis ici -->
      <div id="setHome"><div id="setCore">
      <div class="set-tiles">
        <label class="st2" data-i18n-aria="set.auto"><input type="checkbox" id="setAuto"><svg viewBox="0 0 24 24"><path d="M5 18L9 6M11 18L15 6M17 18L21 6"/></svg><span data-i18n="set.autoS"></span><i></i></label>
        <label class="st2" data-i18n-aria="set.vib"><input type="checkbox" id="setVib"><svg viewBox="0 0 24 24"><path d="M8 3H16V21H8Z M4 8V16 M20 8V16"/></svg><span data-i18n="set.vibS"></span><i></i></label>
        <label class="st2" data-i18n-aria="set.shake"><input type="checkbox" id="setShake"><svg viewBox="0 0 24 24"><path d="M3 12H6L8 6L11 18L14 9L16 14L18 12H21"/></svg><span data-i18n="set.shakeS"></span><i></i></label>
        <label class="st2" data-i18n-aria="set.fx"><input type="checkbox" id="setFx"><svg viewBox="0 0 24 24"><path d="M12 3L14.2 9.8L21 12L14.2 14.2L12 21L9.8 14.2L3 12L9.8 9.8Z"/></svg><span data-i18n="set.fxS"></span><i></i></label>
        <label class="st2" data-i18n-aria="set.hudSk"><input type="checkbox" id="setHudSk"><svg viewBox="0 0 24 24"><path d="M3 6H9V12H3Z M15 6H21V12H15Z M9 15H15V21H9Z"/></svg><span data-i18n="set.hudSkS"></span><i></i></label>
        <label class="st2" data-i18n-aria="set.calm"><input type="checkbox" id="setCalm"><svg viewBox="0 0 24 24"><path d="M12 3L3 20H21Z M12 10V14 M12 17V17.4"/></svg><span data-i18n="set.calmS"></span><i></i></label>
      </div>
      <div class="list settings">
        <label class="row"><span data-i18n="set.vol"></span><input type="range" id="setVol" min="0" max="1" step="0.05"></label>
        <div class="row ts"><span data-i18n="set.move"></span><div class="tsz mv" id="setMove"><button data-v="0" data-i18n="set.moveTouch"></button><button data-v="1" data-i18n="set.moveTilt"></button></div></div>
        <div class="row ts"><span data-i18n="set.sens"></span><div class="tsz sens" id="setSens"></div></div>
        <div class="row ts"><span data-i18n="set.ts"></span><div class="tsz" id="setTs"><button data-v="1" data-i18n-aria="set.ts1">A</button><button data-v="1.15" data-i18n-aria="set.ts2">A</button><button data-v="1.3" data-i18n-aria="set.ts3">A</button></div></div>
      </div>
      </div></div>
      <div class="list settings">
        <div class="row" id="instRow" hidden><span data-i18n="pwa.row"></span><button class="pill small" id="instBtn" data-i18n="pwa.install"></button></div>
        <div class="row"><span data-i18n="set.save"></span><button class="pill small" id="expBtn" data-i18n="set.export"></button><button class="pill small" id="impBtn" data-i18n="set.import"></button></div>
        <div class="row"><span data-i18n="set.reset"></span><button class="pill small danger" id="resetBtn" data-i18n="set.resetBtn"></button></div>
      </div>
      <p class="foot" data-i18n="profile.foot"></p>
      <p class="foot"><a href="confidentialite.html" data-i18n="profile.privacy"></a></p>
      <p class="foot ver" id="verLine"></p>
      <div id="devBox"></div>
    </div>
  </section>

  <!-- ===================== BARRE D'ONGLETS ===================== -->
  <nav class="tabbar" id="tabbar" data-i18n-aria="nav.aria">
    <button data-go="s-home" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12C6 6 8 6 10 12C12 18 14 18 16 12C18 6 20 6 21 9"/></svg><span data-i18n="nav.missions"></span></button>
    <button data-go="s-hangar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V10L12 5L20 10V19M9 19V14H15V19"/></svg><span data-i18n="nav.hangar"></span></button>
    <button data-go="s-inf"><svg class="lk" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11V8.5A4 4 0 0 1 16 8.5V11"/><path d="M6 11H18V20H6Z" fill="currentColor"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12C9 8 5 8 5 12C5 16 9 16 12 12C15 8 19 8 19 12C19 16 15 16 12 12Z"/></svg><span data-i18n="nav.inf"></span></button>
    <button data-go="s-profile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M10 20V7M15 20V10M20 20V4"/></svg><span data-i18n="nav.profile"></span></button>
  </nav>

  <!-- ===================== JEU ===================== -->
  <section class="layer" id="s-game" data-i18n-aria="aria.game">
    <div id="stage"><canvas id="cv"></canvas></div>
    <div id="hud">
      <div class="hud-top">
        <div class="hud-score"><b id="hScore">0</b><span id="hCombo"></span></div>
        <div class="hud-pill" id="hPill"></div>
        <div class="hud-right"><button class="icon-btn" id="pauseBtn" data-i18n-aria="aria.pause"><svg viewBox="0 0 24 24"><path d="M9 6V18M15 6V18"/></svg></button></div>
      </div>
      <div class="hud-hp" id="hHp"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.5L13 9L18.5 15.5L12 14L10 18.5L8 14L1.5 15.5L7 9Z"/></svg><span id="hHpSeg"></span><b id="hHpN"></b></div>
      <div class="hud-xp"><i id="hXp"></i><span id="hLvl"></span></div>
      <div class="hud-weapon" id="hWeapon"></div>
      <div class="hud-sk" id="hSkills" aria-hidden="true"></div>
      <div class="hud-fps" id="hFps" aria-hidden="true"></div>
      <div class="hud-boss hidden" id="hBoss"><span id="hBossName"></span><div><b id="hBossLag"></b><i id="hBossFill"></i></div></div>
      <div class="banner" id="banner"><b></b><span></span></div>
      <div class="hint" id="hint"></div>
      <button class="act ult" id="ultBtn" data-i18n-aria="aria.ult"><svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="33" class="track"/><circle cx="36" cy="36" r="33" class="ring" id="ultRing"/></svg><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2L5 13.6H11L9.8 22L19 9.6H13Z" fill="#BFD9F5" stroke="#07080A" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
      <button class="act onde" id="ondeBtn" data-i18n-aria="aria.onde"><svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="33" class="track"/><circle cx="36" cy="36" r="33" class="ring" id="ondeRing"/></svg><svg class="ic" viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="31" rx="21" ry="9" fill="none" stroke="#E8A15A" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="30 5"/><ellipse cx="24" cy="31" rx="13.5" ry="5.6" fill="none" stroke="#E8A15A" stroke-width="2.2" opacity=".8"/><ellipse cx="24" cy="31" rx="6.5" ry="2.6" fill="none" stroke="#F2C08A" stroke-width="1.6" opacity=".7"/><path d="M24 9L27 20L32.5 25.5L26.4 24.6L24 29L21.6 24.6L15.5 25.5L21 20Z" fill="#F2EEE6" stroke="#07080A" stroke-width="1.2" stroke-linejoin="round"/><path d="M3 21.5L6 25M45 21.5L42 25M10 42.5L12.5 39M38 42.5L35.5 39" stroke="#E8574A" stroke-width="2.6" stroke-linecap="round"/></svg></button>
    </div>
  </section>

  <!-- ===================== BRIEFING ===================== -->
  <section class="layer" id="s-brief" data-i18n-aria="aria.brief">
    <button class="skip" id="briefSkip" data-i18n="brief.skip"></button>
    <canvas id="briefWave" aria-hidden="true"></canvas>
    <div class="brief-text"><span id="briefWho"></span><p id="briefLine"></p></div>
    <div class="dots" id="briefDots"></div>
    <button class="pill primary" id="briefNext" data-i18n="brief.next"></button>
  </section>

  <!-- ===================== FEUILLE (montée de niveau, pause, fin) ===================== -->
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"><i class="grab"></i><div id="sheetBody"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/lang.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/icons.js"></script>
<script src="js/ships.js"></script>
<script src="js/worlds.js"></script>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/ideas.js"></script>
<script src="js/dev.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
